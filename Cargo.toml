[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
opt-level = 0
debug = "full"
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
strip = "none"
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = "none"
